name: GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # nightly at 6:00 UTC

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Check out repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y pngcrush
          npm install
          pip install -r tools/requirements-build_docs.txt

      - name: Build
        run: |
          npm run build

      - name: Install mdbook
        env:
          MDBOOK_VERSION: "0.4.43"
          MDBOOK_MERMAID_VERSION: "0.14.0"
          MDBOOK_PLANTUML_VERSION: "0.8.0"
          MDBOOK_PLANTUML_RUST_VERSION: "1.99.0"
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C $HOME/.local/bin
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C $HOME/.local/bin
          # Cargo 1.100+ uses the bundled lockfile even without --locked.
          # Pin the installer to avoid 0.8.0's incompatible traitobject dependency.
          rustup toolchain install "${MDBOOK_PLANTUML_RUST_VERSION}" --profile minimal --no-self-update
          cargo +"${MDBOOK_PLANTUML_RUST_VERSION}" install mdbook-plantuml --version "=${MDBOOK_PLANTUML_VERSION}" --no-default-features
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build docs
        run: |
          python tools/build_docs.py --output book --verbose

      - name: Copy docs into dist
        run: cp -r book/* dist/docs/

      - name: Install register generator dependencies
        run: pip install -r tools/requirements-build_regs.txt

      - name: Build register docs
        run: python tools/build_regs.py --output regs-build --verbose

      - name: Copy register docs into dist
        run: cp -r regs-build/regs dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # Separate deployment from upload to allow artifact discovery to catch up
  # and let failed deployments be retried without uploading another artifact.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
